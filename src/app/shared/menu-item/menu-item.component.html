<button type="button" class="menu-item" [attr.aria-label]="name" [attr.aria-current]="currentActive === router ? 'page' : null" (click)="onClickMenuItem()">
  <div class="original-display">
    <i [ngClass]="icon"></i>
  </div>
  <div
    class="hover-display"
    [ngClass]="currentActive == router ? 'active' : ''"
  >
    <p class="display-label">{{ name }}</p>
    <i [ngClass]="icon"></i>
  </div>
</button>
